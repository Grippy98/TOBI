[package]
name = "tobi"
version = "0.1.0"
edition = "2024"
description = "TOBI: TI Out of Box Installer for Sitara starter kit evaluation modules"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hex = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
xz2 = "0.1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.10"
